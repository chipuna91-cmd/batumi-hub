<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batumi Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }
        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 28px 20px 32px;
            text-align: center;
        }
        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }
        header p {
            font-size: 15px;
            opacity: 0.9;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .search-box {
            margin-bottom: 24px;
        }
        .search-box input {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: white;
        }
        .search-box input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .section-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .category {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }
        .category:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(0,0,0,0.08);
        }
        .category.active {
            background: #eef2ff;
            border-color: #4f46e5;
            color: #3730a3;
        }
        .category-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }
        .category-name {
            font-size: 14px;
            font-weight: 600;
        }
        .businesses-section {
            margin-top: 10px;
        }
        .businesses-list {
            display: grid;
            gap: 16px;
        }
        .business-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: 0.2s;
        }
        .business-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.09);
        }
        .business-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }
        .business-image-placeholder {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2f7;
            font-size: 50px;
        }
        .business-content {
            padding: 18px;
        }
        .business-content h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .business-description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .business-info {
            font-size: 14px;
            color: #4b5563;
            margin-top: 7px;
        }
        .business-link {
            margin-top: 14px;
            color: #4f46e5;
            font-weight: 600;
            font-size: 14px;
        }
        .status {
            text-align: center;
            padding: 25px 10px;
            color: #6b7280;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .empty {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }
        @media (min-width: 600px) {
            .categories {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 900px) {
            .categories {
                grid-template-columns: repeat(4, 1fr);
            }
            .businesses-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Batumi Hub</h1>
    <p>Все услуги Батуми в одном месте</p>
</header>
<div class="container">
    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Поиск бизнеса..."
        >
    </div>
    <div class="section-title">
        Категории
    </div>
    <div class="categories">
        <div class="category" data-category="apartments">
            <div class="category-icon">🏠</div>
            <div class="category-name">Апартаменты</div>
        </div>
        <div class="category" data-category="car_rental">
            <div class="category-icon">🚗</div>
            <div class="category-name">Аренда авто</div>
        </div>
        <div class="category" data-category="transfers">
            <div class="category-icon">🚕</div>
            <div class="category-name">Трансферы</div>
        </div>
        <div class="category" data-category="excursions">
            <div class="category-icon">🗺️</div>
            <div class="category-name">Экскурсии</div>
        </div>
        <div class="category" data-category="restaurants">
            <div class="category-icon">🍽️</div>
            <div class="category-name">Рестораны</div>
        </div>
        <div class="category" data-category="salons">
            <div class="category-icon">💇</div>
            <div class="category-name">Салоны</div>
        </div>
        <div class="category" data-category="barbershops">
            <div class="category-icon">💈</div>
            <div class="category-name">Барбершопы</div>
        </div>
        <div class="category" data-category="psychology">
            <div class="category-icon">🧠</div>
            <div class="category-name">Психология</div>
        </div>
        <div class="category" data-category="dentistry">
            <div class="category-icon">🦷</div>
            <div class="category-name">Стоматология</div>
        </div>
        <div class="category" data-category="cosmetology">
            <div class="category-icon">💄</div>
            <div class="category-name">Косметология</div>
        </div>
        <div class="category" data-category="fitness">
            <div class="category-icon">🏋️</div>
            <div class="category-name">Фитнес</div>
        </div>
        <div class="category" data-category="language_schools">
            <div class="category-icon">🗣️</div>
            <div class="category-name">Языковые школы</div>
        </div>
    </div>
    <div class="businesses-section">
        <div class="section-title" id="businesses-title">
            Бизнесы
        </div>
        <div id="message"></div>
        <div
            class="businesses-list"
            id="businesses-list"
        ></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://mzbweaovalklyojtdrmq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_uaJkPRsPjlYnv-JPUU0UfA_EV9JEzmx";
    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    const categories = document.querySelectorAll(".category");
    const searchInput = document.getElementById("search");
    const businessesList = document.getElementById("businesses-list");
    const businessesTitle = document.getElementById("businesses-title");
    const message = document.getElementById("message");
    let allBusinesses = [];
    let selectedCategory = null;
    const categoryNames = {
        apartments: "Апартаменты",
        car_rental: "Аренда авто",
        transfers: "Трансферы",
        excursions: "Экскурсии",
        restaurants: "Рестораны",
        salons: "Салоны",
        barbershops: "Барбершопы",
        psychology: "Психология",
        dentistry: "Стоматология",
        cosmetology: "Косметология",
        fitness: "Фитнес",
        language_schools: "Языковые школы"
    };
    async function loadBusinesses() {
        businessesList.innerHTML =
            '<div class="status">Загрузка бизнесов...</div>';
        message.innerHTML = "";
        const { data, error } = await supabaseClient
            .from("businesses")
            .select("*")
            .eq("status", "active");
        if (error) {
            console.error(error);
            businessesList.innerHTML = "";
            message.innerHTML = `
                <div class="error">
                    Ошибка загрузки бизнесов:<br>
                    ${error.message}
                </div>
            `;
            return;
        }
        allBusinesses = data || [];
        businessesList.innerHTML = `
            <div class="status">
                Выберите категорию выше
            </div>
        `;
    }
    function renderBusinesses() {
        const searchText =
            searchInput.value
                .trim()
                .toLowerCase();
        let filtered = allBusinesses;
        if (selectedCategory) {
            filtered = filtered.filter(function(business) {
                return business.category === selectedCategory;
            });
        }
        if (searchText) {
            filtered = filtered.filter(function(business) {
                const name =
                    (business.name || "").toLowerCase();
                const description =
                    (business.description || "").toLowerCase();
                const address =
                    (business.address || "").toLowerCase();
                const category =
                    (business.category || "").toLowerCase();
                return (
                    name.includes(searchText) ||
                    description.includes(searchText) ||
                    address.includes(searchText) ||
                    category.includes(searchText)
                );
            });
        }
        if (selectedCategory) {
            businessesTitle.textContent =
                categoryNames[selectedCategory] ||
                selectedCategory;
        } else {
            businessesTitle.textContent = "Бизнесы";
        }
        if (filtered.length === 0) {
            businessesList.innerHTML = `
                <div class="empty">
                    В этой категории пока нет добавленных бизнесов.
                </div>
            `;
            return;
        }
        businessesList.innerHTML = "";
        filtered.forEach(function(business) {
            const card =
                document.createElement("div");
            card.className = "business-card";
            let imageHTML = "";
            if (business.image_url) {
                imageHTML = `
                    <img
                        class="business-image"
                        src="${business.image_url}"
                        alt="${business.name || "Business"}"
                    >
                `;
            } else {
                imageHTML = `
                    <div class="business-image-placeholder">
                        🏢
                    </div>
                `;
            }
            card.innerHTML = `
                ${imageHTML}
                <div class="business-content">
                    <h3>
                        ${business.name || "Без названия"}
                    </h3>
                    ${
                        business.description
                        ? `
                            <div class="business-description">
                                ${business.description}
                            </div>
                        `
                        : ""
                    }
                    ${
                        business.address
                        ? `
                            <div class="business-info">
                                📍 ${business.address}
                            </div>
                        `
                        : ""
                    }
                    ${
                        business.phone
                        ? `
                            <div class="business-info">
                                📞 ${business.phone}
                            </div>
                        `
                        : ""
                    }
                    <div class="business-link">
                        Подробнее →
                    </div>
                </div>
            `;
            card.addEventListener("click", function() {
                alert(
                    "Страница бизнеса будет открыта на следующем этапе."
                );
            });
            businessesList.appendChild(card);
        });
    }
    categories.forEach(function(category) {
        category.addEventListener("click", function() {
            categories.forEach(function(item) {
                item.classList.remove("active");
            });
            category.classList.add("active");
            selectedCategory =
                category.dataset.category;
            searchInput.value = "";
            renderBusinesses();
            document.querySelector(
                ".businesses-section"
            ).scrollIntoView({
                behavior: "smooth"
            });
        });
    });
    searchInput.addEventListener(
        "input",
        function() {
            renderBusinesses();
        }
    );
    loadBusinesses();
</script>
</body>
</html>
