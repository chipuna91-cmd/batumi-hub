<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batumi Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #eef6f8;
            color: #16323a;
        }
        header {
            background: #0f4c5c;
            padding: 20px 16px 14px;
            border-bottom: 1px solid #0a3b47;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
        }
        .subtitle {
            margin-top: 5px;
            font-size: 14px;
            color: #c7e8ed;
        }
        .languages {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .language-btn {
            border: 1px solid #6eaab5;
            background: transparent;
            color: #e9f8fa;
            border-radius: 8px;
            padding: 7px 9px;
            font-size: 12px;
            cursor: pointer;
        }
        .language-btn.active {
            background: #38a3a5;
            color: white;
            border-color: #38a3a5;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        .search-box {
            margin-bottom: 22px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #c9dfe3;
            border-radius: 12px;
            background: #ffffff;
            color: #16323a;
            font-size: 16px;
            outline: none;
        }
        .search-box input::placeholder {
            color: #7c989f;
        }
        .search-box input:focus {
            border-color: #38a3a5;
            box-shadow: 0 0 0 3px rgba(56, 163, 165, 0.12);
        }
        .section-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #16323a;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }
        .category {
            background: #ffffff;
            border: 1px solid #cfe1e5;
            border-radius: 14px;
            padding: 17px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            box-shadow: 0 3px 10px rgba(15, 76, 92, 0.05);
        }
        .category:active {
            transform: scale(0.98);
        }
        .category.active {
            border-color: #38a3a5;
            background: #dff4f3;
            color: #0f4c5c;
            box-shadow: 0 4px 14px rgba(56, 163, 165, 0.15);
        }
        .category-icon {
            font-size: 28px;
            margin-bottom: 7px;
        }
        .category-name {
            font-size: 14px;
            font-weight: 600;
        }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }
        .result-count {
            color: #6b858c;
            font-size: 13px;
        }
        .businesses-list {
            display: grid;
            gap: 14px;
        }
        .business-card {
            background: #ffffff;
            border: 1px solid #cfe1e5;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(15, 76, 92, 0.06);
        }
        .business-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }
        .business-image-placeholder {
            width: 100%;
            height: 190px;
            background: #dcecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .business-content {
            padding: 16px;
        }
        .business-name {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #16323a;
        }
        .business-description {
            color: #607b82;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 9px;
        }
        .business-info {
            color: #506b72;
            font-size: 14px;
            margin-top: 6px;
        }
        .details-button {
            display: inline-block;
            margin-top: 13px;
            padding: 9px 13px;
            border-radius: 9px;
            background: #0f4c5c;
            color: white;
            font-size: 13px;
            font-weight: 600;
        }
        .status {
            background: #ffffff;
            border: 1px solid #cfe1e5;
            border-radius: 14px;
            padding: 25px 18px;
            text-align: center;
            color: #6b858c;
        }
        .error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f3c0c0;
            border-radius: 12px;
            padding: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .empty {
            background: #ffffff;
            border: 1px solid #cfe1e5;
            border-radius: 14px;
            padding: 25px 18px;
            text-align: center;
            color: #6b858c;
        }
        @media (min-width: 600px) {
            .categories {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 900px) {
            .categories {
                grid-template-columns: repeat(4, 1fr);
            }
            .businesses-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-top">
        <div>
            <div class="logo">Batumi Hub</div>
            <div class="subtitle" id="subtitle">
                Все услуги Батуми в одном месте
            </div>
        </div>
        <div class="languages">
            <button
                class="language-btn active"
                data-lang="ka">
                ქართული
            </button>
            <button
                class="language-btn"
                data-lang="ru">
                Русский
            </button>
            <button
                class="language-btn"
                data-lang="en">
                English
            </button>
        </div>
    </div>
</header>
<div class="container">
    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Поиск..."
        >
    </div>
    <div
        class="section-title"
        id="categories-title">
        Категории
    </div>
    <div class="categories">
        <div
            class="category"
            data-category="apartments">
            <div class="category-icon">
                🏠
            </div>
            <div class="category-name">
                Апартаменты
            </div>
        </div>
        <div
            class="category"
            data-category="car_rental">
            <div class="category-icon">
                🚗
            </div>
            <div class="category-name">
                Аренда авто
            </div>
        </div>
        <div
            class="category"
            data-category="transfers">
            <div class="category-icon">
                🚕
            </div>
            <div class="category-name">
                Трансферы
            </div>
        </div>
        <div
            class="category"
            data-category="excursions">
            <div class="category-icon">
                🗺️
            </div>
            <div class="category-name">
                Экскурсии
            </div>
        </div>
        <div
            class="category"
            data-category="restaurants">
            <div class="category-icon">
                🍽️
            </div>
            <div class="category-name">
                Рестораны
            </div>
        </div>
        <div
            class="category"
            data-category="salons">
            <div class="category-icon">
                💇
            </div>
            <div class="category-name">
                Салоны
            </div>
        </div>
        <div
            class="category"
            data-category="barbershops">
            <div class="category-icon">
                💈
            </div>
            <div class="category-name">
                Барбершопы
            </div>
        </div>
        <div
            class="category"
            data-category="psychology">
            <div class="category-icon">
                🧠
            </div>
            <div class="category-name">
                Психология
            </div>
        </div>
        <div
            class="category"
            data-category="dentistry">
            <div class="category-icon">
                🦷
            </div>
            <div class="category-name">
                Стоматология
            </div>
        </div>
        <div
            class="category"
            data-category="cosmetology">
            <div class="category-icon">
                💄
            </div>
            <div class="category-name">
                Косметология
            </div>
        </div>
        <div
            class="category"
            data-category="fitness">
            <div class="category-icon">
                🏋️
            </div>
            <div class="category-name">
                Фитнес
            </div>
        </div>
        <div
            class="category"
            data-category="language_schools">
            <div class="category-icon">
                🗣️
            </div>
            <div class="category-name">
                Языковые школы
            </div>
        </div>
    </div>
    <div class="result-header">
        <div
            class="section-title"
            id="businesses-title">
            Бизнесы
        </div>
        <div
            class="result-count"
            id="result-count">
        </div>
    </div>
    <div id="message"></div>
    <div
        class="businesses-list"
        id="businesses-list">
        <div class="status">
            Выберите категорию
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL =
        "https://mzbweaovalklyojtdrmq.supabase.co";
    const SUPABASE_KEY =
        "sb_publishable_uaJkPRsPjlYnv-JPUU0UfA_EV9JEzmx";
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    const categories =
        document.querySelectorAll(".category");
    const searchInput =
        document.getElementById("search");
    const businessesList =
        document.getElementById("businesses-list");
    const businessesTitle =
        document.getElementById("businesses-title");
    const resultCount =
        document.getElementById("result-count");
    const message =
        document.getElementById("message");
    let allBusinesses = [];
    let selectedCategory = null;
    const categoryNames = {
        apartments: "Апартаменты",
        car_rental: "Аренда авто",
        transfers: "Трансферы",
        excursions: "Экскурсии",
        restaurants: "Рестораны",
        salons: "Салоны",
        barbershops: "Барбершопы",
        psychology: "Психология",
        dentistry: "Стоматология",
        cosmetology: "Косметология",
        fitness: "Фитнес",
        language_schools: "Языковые школы"
    };
    async function loadBusinesses() {
        businessesList.innerHTML =
            '<div class="status">Загрузка...</div>';
        message.innerHTML = "";
        const result =
            await supabaseClient
                .from("businesses")
                .select("*")
                .eq("status", "active");
        const data = result.data;
        const error = result.error;
        if (error) {
            console.error(error);
            businessesList.innerHTML = "";
            message.innerHTML = `
                <div class="error">
                    Ошибка загрузки бизнесов:<br>
                    ${error.message}
                </div>
            `;
            return;
        }
        allBusinesses = data || [];
        businessesList.innerHTML = `
            <div class="status">
                Выберите категорию выше
            </div>
        `;
    }
    function renderBusinesses() {
        const searchText =
            searchInput.value
                .trim()
                .toLowerCase();
        let filtered =
            allBusinesses.slice();
        if (selectedCategory) {
            filtered =
                filtered.filter(function(business) {
                    return (
                        String(business.category || "")
                            .trim()
                            .toLowerCase()
                        ===
                        selectedCategory
                    );
                });
        }
        if (searchText) {
            filtered =
                filtered.filter(function(business) {
                    const name =
                        String(business.name || "")
                            .toLowerCase();
                    const description =
                        String(business.description || "")
                            .toLowerCase();
                    const address =
                        String(business.address || "")
                            .toLowerCase();
                    const category =
                        String(business.category || "")
                            .toLowerCase();
                    return (
                        name.includes(searchText) ||
                        description.includes(searchText) ||
                        address.includes(searchText) ||
                        category.includes(searchText)
                    );
                });
        }
        if (selectedCategory) {
            businessesTitle.textContent =
                categoryNames[selectedCategory]
                || selectedCategory;
        } else {
            businessesTitle.textContent =
                "Бизнесы";
        }
        resultCount.textContent =
            filtered.length + " бизнес(ов)";
        if (filtered.length === 0) {
            businessesList.innerHTML = `
                <div class="empty">
                    В этой категории пока нет добавленных бизнесов.
                </div>
            `;
            return;
        }
        businessesList.innerHTML = "";
        filtered.forEach(function(business) {
            const card =
                document.createElement("div");
            card.className =
                "business-card";
            let imageHTML;
            if (business.image_url) {
                imageHTML = `
                    <img
                        class="business-image"
                        src="${business.image_url}"
                        alt="${business.name || "Business"}"
                    >
                `;
            } else {
                imageHTML = `
                    <div class="business-image-placeholder">
                        🏢
                    </div>
                `;
            }
            card.innerHTML = `
                ${imageHTML}
                <div class="business-content">
                    <div class="business-name">
                        ${business.name || "Без названия"}
                    </div>
                    ${
                        business.description
                        ? `
                            <div class="business-description">
                                ${business.description}
                            </div>
                        `
                        : ""
                    }
                    ${
                        business.address
                        ? `
                            <div class="business-info">
                                📍 ${business.address}
                            </div>
                        `
                        : ""
                    }
                    ${
                        business.phone
                        ? `
                            <div class="business-info">
                                📞 ${business.phone}
                            </div>
                        `
                        : ""
                    }
                    <div class="details-button">
                        Подробнее →
                    </div>
                </div>
            `;
            businessesList.appendChild(card);
        });
    }
    categories.forEach(function(category) {
        category.addEventListener(
            "click",
            function() {
                categories.forEach(
                    function(item) {
                        item.classList.remove("active");
                    }
                );
                category.classList.add("active");
                selectedCategory =
                    category
                        .getAttribute("data-category");
                searchInput.value = "";
                renderBusinesses();
                document
                    .querySelector(".businesses-list")
                    .scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
            }
        );
    });
    searchInput.addEventListener(
        "input",
        function() {
            renderBusinesses();
        }
    );
    document
        .querySelectorAll(".language-btn")
        .forEach(function(button) {
            button.addEventListener(
                "click",
                function() {
                    document
                        .querySelectorAll(".language-btn")
                        .forEach(function(item) {
                            item.classList.remove("active");
                        });
                    button.classList.add("active");
                }
            );
        });
    loadBusinesses();
</script>
</body>
</html>
