<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batumi Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #fff3a6 0%,
                    #ffd1a9 22%,
                    #ff9fb5 45%,
                    #d9a7ff 70%,
                    #8fc8ff 100%
                );
            color: #222;
        }
        .header {
            padding: 24px 16px 20px;
            background:
                linear-gradient(
                    135deg,
                    #ffdc6a 0%,
                    #ff9a9e 38%,
                    #c77dff 70%,
                    #72b7ff 100%
                );
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.18);
        }
        .subtitle {
            margin-top: 5px;
            color: rgba(255,255,255,0.95);
            font-size: 14px;
            font-weight: 500;
        }
        .languages {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        /* ФЛАГИ — только изображения, никаких букв */
        .language-button {
            width: 42px;
            height: 36px;
            padding: 4px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.82);
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.2s ease;
        }
        .language-button svg {
            width: 30px;
            height: 21px;
            display: block;
            border-radius: 2px;
        }
        .language-button.active {
            transform: translateY(-2px) scale(1.05);
            background: white;
            box-shadow: 0 5px 14px rgba(0,0,0,0.20);
        }
        .language-button:hover {
            transform: translateY(-2px);
        }
        .search-wrap {
            margin-top: 18px;
        }
        .search {
            width: 100%;
            padding: 15px 18px;
            border: none;
            outline: none;
            border-radius: 18px;
            background: rgba(255,255,255,0.95);
            font-size: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
        }
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 22px 14px 40px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .category {
            border: none;
            padding: 17px 12px;
            border-radius: 18px;
            background: rgba(255,255,255,0.90);
            color: #333;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 16px rgba(0,0,0,0.08);
            transition: 0.2s ease;
        }
        .category:hover {
            transform: translateY(-2px);
        }
        .category.active {
            color: white;
            background:
                linear-gradient(
                    135deg,
                    #ff8a65,
                    #e85d9e,
                    #8e6ce8
                );
            box-shadow: 0 7px 18px rgba(160,70,150,0.28);
        }
        .section-title {
            margin: 28px 4px 14px;
            font-size: 22px;
            font-weight: 850;
            color: #222;
        }
        .businesses {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .business-card {
            overflow: hidden;
            border-radius: 22px;
            background: rgba(255,255,255,0.94);
            box-shadow: 0 8px 22px rgba(0,0,0,0.11);
        }
        .business-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background: #eee;
        }
        .business-content {
            padding: 16px;
        }
        .business-name {
            font-size: 20px;
            font-weight: 800;
            color: #222;
        }
        .business-description {
            margin-top: 7px;
            color: #555;
            font-size: 14px;
            line-height: 1.45;
        }
        .business-info {
            margin-top: 12px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
        .details-button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background:
                linear-gradient(
                    135deg,
                    #ff8a65,
                    #e85d9e,
                    #8e6ce8
                );
        }
        .status {
            text-align: center;
            padding: 30px 10px;
            color: #555;
            font-size: 15px;
        }
        @media (min-width: 700px) {
            .categories {
                grid-template-columns: repeat(3, 1fr);
            }
            .businesses {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1000px) {
            .categories {
                grid-template-columns: repeat(4, 1fr);
            }
            .businesses {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-top">
        <div>
            <div class="logo">
                BATUMI HUB
            </div>
            <div

            <button

            <!-- ВЕЛИКОБРИТАНИЯ -->
            <button

            >
                <svg

                    xmlns="http://www.w3.org/2000/svg"
                >
                    <rect

                    <path

                    />
                    <path
                        d="M0 0 L12 0 L280 160 L280 180 L268 180 L0 20 Z"
                        fill="#c8102e"
                    />
                    <path
                        d="M280 0 L268 0 L0 160 L0 180 L12 180 L280 20 Z"
                        fill="#c8102e"
                    />
                    <rect
                        x="115"
                        width="50"
                        height="180"
                        fill="#ffffff"
                    />
                    <rect
                        y="65"
                        width="280"
                        height="50"
                        fill="#ffffff"
                    />
                    <rect
                        x="125"
                        width="30"
                        height="180"
                        fill="#c8102e"
                    />
                    <rect
                        y="75"
                        width="280"
                        height="30"
                        fill="#c8102e"
                    />
                </svg>
            </button>
        </div>
    </div>
    <!-- ПОИСК: БЕЗ ТЕКСТА И PLACEHOLDER -->
    <div class="search-wrap">
        <input
            type="text"
            id="searchInput"
            class="search"
            autocomplete="off"
            aria-label="Search"
        >
    </div>
</header>
<main class="container">
    <div class="categories">
        <button
            class="category active"
            data-category="all"
            data-i18n="all"
        >
            Все
        </button>
        <button
            class="category"
            data-category="apartments"
            data-i18n="apartments"
        >
            Квартиры
        </button>
        <button
            class="category"
            data-category="excursions"
            data-i18n="excursions"
        >
            Экскурсии
        </button>
        <button
            class="category"
            data-category="transfers"
            data-i18n="transfers"
        >
            Трансферы
        </button>
        <button
            class="category"
            data-category="car_rental"
            data-i18n="car_rental"
        >
            Аренда авто
        </button>
        <button
            class="category"
            data-category="restaurants"
            data-i18n="restaurants"
        >
            Рестораны
        </button>
        <button
            class="category"
            data-category="salons"
            data-i18n="salons"
        >
            Салоны
        </button>
        <button
            class="category"
            data-category="barbershops"
            data-i18n="barbershops"
        >
            Барбершопы
        </button>
        <button
            class="category"
            data-category="psychology"
            data-i18n="psychology"
        >
            Психология
        </button>
        <button
            class="category"
            data-category="dentistry"
            data-i18n="dentistry"
        >
            Стоматология
        </button>
        <button
            class="category"
            data-category="cosmetology"
            data-i18n="cosmetology"
        >
            Косметология
        </button>
        <button
            class="category"
            data-category="fitness"
            data-i18n="fitness"
        >
            Фитнес
        </button>
        <button
            class="category"
            data-category="language_schools"
            data-i18n="language_schools"
        >
            Языковые школы
        </button>
    </div>
    <h2
        class="section-title"
        id="businessesTitle"
        data-i18n="businesses"
    >
        Бизнесы и услуги
    </h2>
    <div
        id="businesses"
        class="businesses"
    >
        <div
            class="status"
            id="loading"
            data-i18n="loading"
        >
            Загружаем...
        </div>
    </div>
</main>
<script>
    const SUPABASE_URL =
        "https://mzbweaovalklyojtdrmq.supabase.co";
    const SUPABASE_KEY =
        "sb_publishable_uaJkPRsPjlYnv-JPUU0UfA_EV9JEzmx";
    const translations = {
        ru: {
            subtitle: "Все услуги Батуми в одном месте",
            all: "Все",
            businesses: "Бизнесы и услуги",
            loading: "Загружаем...",
            empty:
                "В этой категории пока нет бизнесов.",
            error:
                "Не удалось загрузить бизнесы.",
            details:
                "Подробнее →",
            noName:
                "Без названия",
            apartments:
                "Квартиры",
            excursions:
                "Экскурсии",
            transfers:
                "Трансферы",
            car_rental:
                "Аренда авто",
            restaurants:
                "Рестораны",
            salons:
                "Салоны",
            barbershops:
                "Барбершопы",
            psychology:
                "Психология",
            dentistry:
                "Стоматология",
            cosmetology:
                "Косметология",
            fitness:
                "Фитнес",
            language_schools:
                "Языковые школы"
        },
        ka: {
            subtitle:
                "ბათუმის ყველა სერვისი ერთ ადგილზე",
            all:
                "ყველა",
            businesses:
                "ბიზნესები და სერვისები",
            loading:
                "იტვირთება...",
            empty:
                "ამ კატეგორიაში ჯერ ბიზნესი არ არის.",
            error:
                "ბიზნესების ჩატვირთვა ვერ მოხერხდა.",
            details:
                "დეტალურად →",
            noName:
                "სახელის გარეშე",
            apartments:
                "ბინები",
            excursions:
                "ექსკურსიები",
            transfers:
                "ტრანსფერები",
            car_rental:
                "მანქანის ქირაობა",
            restaurants:
                "რესტორნები",
            salons:
                "სალონები",
            barbershops:
                "ბარბერშოპები",
            psychology:
                "ფსიქოლოგია",
            dentistry:
                "სტომატოლოგია",
            cosmetology:
                "კოსმეტოლოგია",
            fitness:
                "ფიტნესი",
            language_schools:
                "ენის სკოლები"
        },
        en: {
            subtitle:
                "All Batumi services in one place",
            all:
                "All",
            businesses:
                "Businesses & Services",
            loading:
                "Loading...",
            empty:
                "There are no businesses in this category yet.",
            error:
                "Failed to load businesses.",
            details:
                "Details →",
            noName:
                "Unnamed",
            apartments:
                "Apartments",
            excursions:
                "Excursions",
            transfers:
                "Transfers",
            car_rental:
                "Car Rental",
            restaurants:
                "Restaurants",
            salons:
                "Salons",
            barbershops:
                "Barbershops",
            psychology:
                "Psychology",
            dentistry:
                "Dentistry",
            cosmetology:
                "Cosmetology",
            fitness:
                "Fitness",
            language_schools:
                "Language Schools"
        }
    };
    let businesses = [];
    let selectedCategory = "all";
    let currentLanguage =
        localStorage.getItem(
            "batumiHubLanguage"
        ) || "ru";
    function t(key) {
        return (
            translations[currentLanguage][key]
            ||
            translations.ru[key]
            ||
            key
        );
    }
    function applyLanguage(language) {
        if (!translations[language]) {
            language = "ru";
        }
        currentLanguage = language;
        localStorage.setItem(
            "batumiHubLanguage",
            language
        );
        document.documentElement.lang =
            language === "ka"
                ? "ka"
                : language;
        document
            .querySelectorAll("[data-i18n]")
            .forEach(element => {
                const key =
                    element.dataset.i18n;
                if (
                    translations[language][key]
                ) {
                    element.textContent =
                        translations[language][key];
                }
            });
        document
            .querySelectorAll(".language-button")
            .forEach(button => {
                button.classList.toggle(
                    "active",
                    button.dataset.language === language
                );
            });
        renderBusinesses();
    }
    function escapeHtml(value) {
        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }
        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }
    function getCategoryName(category) {
        const key =
            category || "";
        return (
            t(key) ||
            key
        );
    }
    function renderBusinesses() {
        const container =
            document.getElementById(
                "businesses"
            );
        const searchValue =
            document
                .getElementById(
                    "searchInput"
                )
                .value
                .trim()
                .toLowerCase();
        const filtered =
            businesses.filter(
                business => {
                    const categoryMatch =
                        selectedCategory === "all"
                        ||
                        business.category ===
                        selectedCategory;
                    if (!categoryMatch) {
                        return false;
                    }
                    if (!searchValue) {
                        return true;
                    }
                    const text = [
                        business.name,
                        business.description,
                        business.address,
                        business.category
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();
                    return text.includes(
                        searchValue
                    );
                }
            );
        if (
            filtered.length === 0
        ) {
            container.innerHTML = `
                <div class="status">
                    ${escapeHtml(
                        t("empty")
                    )}
                </div>
            `;
            return;
        }
        container.innerHTML =
            filtered
                .map(
                    business => {
                        const image =
                            business.image_url
                            ||
                            "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1000&q=80";
                        return `
                            <article class="business-card">
                                <img
                                    class="business-image"
                                    src="${escapeHtml(image)}"
                                    alt="${escapeHtml(
                                        business.name ||
                                        t("noName")
                                    )}"
                                >
                                <div class="business-content">
                                    <div class="business-name">
                                        ${escapeHtml(
                                            business.name ||
                                            t("noName")
                                        )}
                                    </div>
                                    ${
                                        business.description
                                        ?
                                        `
                                            <div class="business-description">
                                                ${escapeHtml(
                                                    business.description
                                                )}
                                            </div>
                                        `
                                        :
                                        ""
                                    }
                                    <div class="business-info">
                                        ${
                                            business.category
                                            ?
                                            `
                                                <div>
                                                    ${escapeHtml(
                                                        getCategoryName(
                                                            business.category
                                                        )
                                                    )}
                                                </div>
                                            `
                                            :
                                            ""
                                        }
                                        ${
                                            business.address
                                            ?
                                            `
                                                <div>
                                                    📍
                                                    ${escapeHtml(
                                                        business.address
                                                    )}
                                                </div>
                                            `
                                            :
                                            ""
                                        }
                                        ${
                                            business.phone
                                            ?
                                            `
                                                <div>
                                                    📞
                                                    ${escapeHtml(
                                                        business.phone
                                                    )}
                                                </div>
                                            `
                                            :
                                            ""
                                        }
                                    </div>
                                    <button
                                        class="details-button"
                                        type="button"
                                    >
                                        ${escapeHtml(
                                            t("details")
                                        )}
                                    </button>
                                </div>
                            </article>
                        `;
                    }
                )
                .join("");
    }
    async function loadBusinesses() {
        const container =
            document.getElementById(
                "businesses"
            );
        container.innerHTML = `
            <div class="status">
                ${escapeHtml(
                    t("loading")
                )}
            </div>
        `;
        try {
            const response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/businesses?select=*&status=eq.active",
                    {
                        method: "GET",
                        headers: {
                            "apikey":
                                SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,
                            "Content-Type":
                                "application/json"
                        }
                    }
                );
            if (!response.ok) {
                throw new Error(
                    "HTTP " +
                    response.status
                );
            }
            businesses =
                await response.json();
            renderBusinesses();
        }
        catch (error) {
            console.error(error);
            container.innerHTML = `
                <div class="status">
                    ${escapeHtml(
                        t("error")
                    )}
                </div>
            `;
        }
    }
    document
        .querySelectorAll(
            ".language-button"
        )
        .forEach(button => {
            button.addEventListener(
                "click",
                () => {
                    applyLanguage(
                        button.dataset.language
                    );
                }
            );
        });
    document
        .querySelectorAll(
            ".category"
        )
        .forEach(button => {
            button.addEventListener(
                "click",
                () => {
                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(item => {
                            item.classList.remove(
                                "active"
                            );
                        });
                    button.classList.add(
                        "active"
                    );
                    selectedCategory =
                        button.dataset.category;
                    renderBusinesses();
                }
            );
        });
    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "input",
            renderBusinesses
        );
    applyLanguage(
        currentLanguage
    );
    loadBusinesses();
</script>
</body>
</html>
