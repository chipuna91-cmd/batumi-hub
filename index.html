<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batumi Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 0% 0%, #feda75 0%, transparent 28%),
                radial-gradient(circle at 100% 0%, #fa7e1e 0%, transparent 32%),
                radial-gradient(circle at 0% 100%, #d62976 0%, transparent 38%),
                radial-gradient(circle at 100% 100%, #962fbf 0%, transparent 40%),
                linear-gradient(
                    135deg,
                    #feda75 0%,
                    #fa7e1e 25%,
                    #d62976 50%,
                    #962fbf 75%,
                    #4f5bd5 100%
                );
            color: #2d1838;
        }
        header {
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5 0%,
                    #962fbf 30%,
                    #d62976 60%,
                    #fa7e1e 85%,
                    #feda75 100%
                );
            color: white;
            padding: 28px 20px 24px;
            box-shadow: 0 8px 30px rgba(80, 30, 100, 0.25);
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .subtitle {
            margin-top: 6px;
            font-size: 15px;
            opacity: 0.92;
        }
        .languages {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .language-button {
            border: 1px solid rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.16);
            color: white;
            width: 42px;
            height: 36px;
            padding: 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }
        .language-button:hover {
            background: rgba(255,255,255,0.30);
            transform: translateY(-2px);
        }
        .language-button.active-language {
            background: rgba(255,255,255,0.38);
            border-color: white;
            transform: scale(1.05);
        }
        .search-container {
            max-width: 1100px;
            margin: 20px auto 0;
        }
        .search-input {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.94);
            color: #35143f;
            font-size: 15px;
            outline: none;
            box-shadow:
                0 8px 25px rgba(80, 20, 100, 0.18);
        }
        .search-input::placeholder {
            color: #927f9b;
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 20px 50px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(145px, 1fr)
            );
            gap: 12px;
        }
        .category {
            border: 1px solid rgba(255,255,255,0.55);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.88),
                    rgba(255,240,249,0.88)
                );
            color: #522060;
            padding: 15px 12px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow:
                0 7px 20px rgba(100, 30, 120, 0.13);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }
        .category:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 25px rgba(120, 30, 130, 0.22);
        }
        .category.active {
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
            box-shadow:
                0 8px 25px rgba(150, 47, 191, 0.35);
        }
        .results-section {
            margin-top: 30px;
        }
        .results-title {
            color: white;
            font-size: 23px;
            font-weight: 750;
            margin-bottom: 16px;
            text-shadow:
                0 2px 10px rgba(70, 20, 90, 0.25);
        }
        .businesses-list {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );
            gap: 18px;
        }
        .business-card {
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.96),
                    rgba(255,240,249,0.96)
                );
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 20px;
            box-shadow:
                0 12px 35px rgba(90, 20, 110, 0.20);
        }
        .business-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }
        .business-image-placeholder {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976,
                    #fa7e1e
                );
        }
        .business-content {
            padding: 18px;
        }
        .business-name {
            color: #4f1d67;
            font-size: 20px;
            font-weight: 750;
            margin-bottom: 8px;
        }
        .business-description {
            color: #654c70;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .business-info {
            color: #73577e;
            font-size: 14px;
            margin-top: 7px;
        }
        .details-button {
            margin-top: 16px;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 12px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
            font-size: 14px;
            font-weight: 650;
            box-shadow:
                0 5px 15px rgba(150, 47, 191, 0.25);
        }
        .details-button:hover {
            background:
                linear-gradient(
                    135deg,
                    #962fbf,
                    #d62976,
                    #fa7e1e
                );
        }
        .empty-state {
            padding: 35px 20px;
            text-align: center;
            background: rgba(255,255,255,0.88);
            border-radius: 18px;
            color: #704f7b;
            box-shadow:
                0 10px 25px rgba(100, 30, 120, 0.15);
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: white;
            font-size: 15px;
        }
        @media (max-width: 600px) {
            header {
                padding: 23px 15px 20px;
            }
            .logo {
                font-size: 28px;
            }
            main {
                padding: 22px 15px 40px;
            }
            .categories {
                grid-template-columns:
                    repeat(2, 1fr);
            }
            .businesses-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <div class="logo">
            Batumi Hub
        </div>
        <div class="subtitle" id="subtitle">
            Все услуги Батуми в одном месте
        </div>
        <div class="languages">
            <button
                class="language-button"
                data-language="ka"
                title="ქართული"
                aria-label="ქართული"
            >
                🇬🇪
            </button>
            <button
                class="language-button"
                data-language="ru"
                title="Русский"
                aria-label="Русский"
            >
                🇷🇺
            </button>
            <button
                class="language-button"
                data-language="en"
                title="English"
                aria-label="English"
            >
                🇬🇧
            </button>
        </div>
        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Поиск бизнеса или услуги..."
            >
        </div>
    </div>
</header>
<main>
    <div class="categories">
        <div class="category" data-category="apartments" data-i18n="apartments">
            🏠 Апартаменты
        </div>
        <div class="category" data-category="car_rental" data-i18n="car_rental">
            🚗 Аренда авто
        </div>
        <div class="category" data-category="transfers" data-i18n="transfers">
            🚕 Трансферы
        </div>
        <div class="category" data-category="excursions" data-i18n="excursions">
            🗺️ Экскурсии
        </div>
        <div class="category" data-category="restaurants" data-i18n="restaurants">
            🍽️ Рестораны
        </div>
        <div class="category" data-category="salons" data-i18n="salons">
            💇 Салоны
        </div>
        <div class="category" data-category="barbershops" data-i18n="barbershops">
            💈 Барбершопы
        </div>
        <div class="category" data-category="psychology" data-i18n="psychology">
            🧠 Психология
        </div>
        <div class="category" data-category="dentistry" data-i18n="dentistry">
            🦷 Стоматология
        </div>
        <div class="category" data-category="cosmetology" data-i18n="cosmetology">
            💄 Косметология
        </div>
        <div class="category" data-category="fitness" data-i18n="fitness">
            🏋️ Фитнес
        </div>
        <div class="category" data-category="language_schools" data-i18n="language_schools">
            📚 Языковые школы
        </div>
    </div>
    <div class="results-section">
        <div class="results-title" id="businessesTitle">
            Бизнесы
        </div>
        <div
            id="businessesList"
            class="businesses-list"
        ></div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL =
        "https://mzbweaovalklyojtdrmq.supabase.co";
    const SUPABASE_KEY =
        "sb_publishable_uaJkPRsPjlYnv-JPUU0UfA_EV9JEzmx";
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    const businessesList =
        document.getElementById(
            "businessesList"
        );
    const searchInput =
        document.getElementById(
            "searchInput"
        );
    const categories =
        document.querySelectorAll(
            ".category"
        );
    const languageButtons =
        document.querySelectorAll(
            ".language-button"
        );
    let allBusinesses = [];
    let selectedCategory = "";
    let currentLanguage =
        localStorage.getItem(
            "batumiHubLanguage"
        ) || "ru";
    const translations = {
        ru: {
            subtitle:
                "Все услуги Батуми в одном месте",
            search:
                "Поиск бизнеса или услуги...",
            businesses:
                "Бизнесы",
            loading:
                "Загружаем бизнесы...",
            empty:
                "Пока здесь нет добавленных бизнесов.",
            error:
                "Ошибка загрузки бизнесов",
            details:
                "Подробнее →",
            noName:
                "Без названия",
            apartments:
                "🏠 Апартаменты",
            car_rental:
                "🚗 Аренда авто",
            transfers:
                "🚕 Трансферы",
            excursions:
                "🗺️ Экскурсии",
            restaurants:
                "🍽️ Рестораны",
            salons:
                "💇 Салоны",
            barbershops:
                "💈 Барбершопы",
            psychology:
                "🧠 Психология",
            dentistry:
                "🦷 Стоматология",
            cosmetology:
                "💄 Косметология",
            fitness:
                "🏋️ Фитнес",
            language_schools:
                "📚 Языковые школы"
        },
        ka: {
            subtitle:
                "ბათუმის ყველა სერვისი ერთ ადგილას",
            search:
                "მოძებნეთ ბიზნესი ან სერვისი...",
            businesses:
                "ბიზნესები",
            loading:
                "ბიზნესები იტვირთება...",
            empty:
                "ჯერ დამატებული ბიზნესი არ არის.",
            error:
                "ბიზნესების ჩატვირთვის შეცდომა",
            details:
                "დეტალურად →",
            noName:
                "სახელის გარეშე",
            apartments:
                "🏠 აპარტამენტები",
            car_rental:
                "🚗 ავტომობილის გაქირავება",
            transfers:
                "🚕 ტრანსფერი",
            excursions:
                "🗺️ ექსკურსიები",
            restaurants:
                "🍽️ რესტორნები",
            salons:
                "💇 სილამაზის სალონები",
            barbershops:
                "💈 ბარბერშოპები",
            psychology:
                "🧠 ფსიქოლოგია",
            dentistry:
                "🦷 სტომატოლოგია",
            cosmetology:
                "💄 კოსმეტოლოგია",
            fitness:
                "🏋️ ფიტნესი",
            language_schools:
                "📚 ენის სკოლები"
        },
        en: {
            subtitle:
                "All Batumi services in one place",
            search:
                "Search for a business or service...",
            businesses:
                "Businesses",
            loading:
                "Loading businesses...",
            empty:
                "There are no businesses added yet.",
            error:
                "Error loading businesses",
            details:
                "Details →",
            noName:
                "No name",
            apartments:
                "🏠 Apartments",
            car_rental:
                "🚗 Car Rental",
            transfers:
                "🚕 Transfers",
            excursions:
                "🗺️ Excursions",
            restaurants:
                "🍽️ Restaurants",
            salons:
                "💇 Salons",
            barbershops:
                "💈 Barbershops",
            psychology:
                "🧠 Psychology",
            dentistry:
                "🦷 Dentistry",
            cosmetology:
                "💄 Cosmetology",
            fitness:
                "🏋️ Fitness",
            language_schools:
                "📚 Language Schools"
        }
    };
    function t(key) {
        return (
            translations[currentLanguage][key] ||
            translations.ru[key] ||
            key
        );
    }
    function applyLanguage(language) {
        if (
            !translations[language]
        ) {
            language = "ru";
        }
        currentLanguage =
            language;
        localStorage.setItem(
            "batumiHubLanguage",
            currentLanguage
        );
        document.documentElement.lang =
            currentLanguage;
        document.getElementById(
            "subtitle"
        ).textContent =
            t("subtitle");
        document.getElementById(
            "searchInput"
        ).placeholder =
            t("search");
        document.getElementById(
            "businessesTitle"
        ).textContent =
            t("businesses");
        document
            .querySelectorAll(
                "[data-i18n]"
            )
            .forEach(
                function(element) {
                    const key =
                        element.dataset.i18n;
                    element.textContent =
                        t(key);
                }
            );
        languageButtons.forEach(
            function(button) {
                button.classList.toggle(
                    "active-language",
                    button.dataset.language ===
                    currentLanguage
                );
            }
        );
        renderBusinesses();
    }
    languageButtons.forEach(
        function(button) {
            button.addEventListener(
                "click",
                function() {
                    applyLanguage(
                        button.dataset.language
                    );
                }
            );
        }
    );
    async function loadBusinesses() {
        businessesList.innerHTML = `
            <div class="loading">
                ${t("loading")}
            </div>
        `;
        const result =
            await supabaseClient
                .from("businesses")
                .select("*")
                .eq("status", "active");
        if (result.error) {
            businessesList.innerHTML = `
                <div class="empty-state">
                    ${t("error")}
                </div>
            `;
            console.error(
                result.error
            );
            return;
        }
        allBusinesses =
            result.data || [];
        renderBusinesses();
    }
    function renderBusinesses() {
        const searchText =
            searchInput.value
                .trim()
                .toLowerCase();
        let filtered =
            allBusinesses.filter(
                function(business) {
                    const matchesSearch =
                        !searchText ||
                        String(
                            business.name || ""
                        )
                        .toLowerCase()
                        .includes(searchText) ||
                        String(
                            business.description || ""
                        )
                        .toLowerCase()
                        .includes(searchText) ||
                        String(
                            business.address || ""
                        )
                        .toLowerCase()
                        .includes(searchText) ||
                        String(
                            business.category || ""
                        )
                        .toLowerCase()
                        .includes(searchText);
                    const matchesCategory =
                        !selectedCategory ||
                        String(
                            business.category || ""
                        )
                        .trim()
                        .toLowerCase()
                        ===
                        selectedCategory;
                    return (
                        matchesSearch &&
                        matchesCategory
                    );
                }
            );
        businessesList.innerHTML = "";
        if (
            filtered.length === 0
        ) {
            businessesList.innerHTML = `
                <div class="empty-state">
                    ${t("empty")}
                </div>
            `;
            return;
        }
        filtered.forEach(
            function(business) {
                const card =
                    document.createElement(
                        "div"
                    );
                card.className =
                    "business-card";
                let imageHTML;
                if (
                    business.image_url
                ) {
                    imageHTML = `
                        <img
                            class="business-image"
                            src="${business.image_url}"
                            alt="${business.name || t("noName")}"
                        >
                    `;
                } else {
                    imageHTML = `
                        <div class="business-image-placeholder">
                            🏢
                        </div>
                    `;
                }
                card.innerHTML = `
                    ${imageHTML}
                    <div class="business-content">
                        <div class="business-name">
                            ${business.name || t("noName")}
                        </div>
                        ${
                            business.description
                            ? `
                                <div class="business-description">
                                    ${business.description}
                                </div>
                            `
                            : ""
                        }
                        ${
                            business.address
                            ? `
                                <div class="business-info">
                                    📍 ${business.address}
                                </div>
                            `
                            : ""
                        }
                        ${
                            business.phone
                            ? `
                                <div class="business-info">
                                    📞 ${business.phone}
                                </div>
                            `
                            : ""
                        }
                        <div class="details-button">
                            ${t("details")}
                        </div>
                    </div>
                `;
                businessesList.appendChild(
                    card
                );
            }
        );
    }
    categories.forEach(
        function(category) {
            category.addEventListener(
                "click",
                function() {
                    categories.forEach(
                        function(item) {
                            item.classList.remove(
                                "active"
                            );
                        }
                    );
                    category.classList.add(
                        "active"
                    );
                    selectedCategory =
                        category.dataset.category;
                    renderBusinesses();
                }
            );
        }
    );
    searchInput.addEventListener(
        "input",
        function() {
            renderBusinesses();
        }
    );
    applyLanguage(
        currentLanguage
    );
    loadBusinesses();
</script>
</body>
</html>
