<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f7d9ff, #d9f0ff);
    color: #2d2330;
}

header {
    padding: 22px 18px 10px;
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    cursor: pointer;
    color: #222;
}

.subtitle {
    margin-top: 7px;
    color: #725c79;
    font-size: 14px;
}

.language-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 16px 0;
}

.language-button {
    width: 42px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
}

.language-button svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 6px;
}

.language-button.active {
    outline: 2px solid #7d4cdb;
    outline-offset: 2px;
}

.search-wrapper {
    max-width: 600px;
    margin: 0 auto 18px;
    padding: 0 16px;
}

.search {
    width: 100%;
    border: none;
    outline: none;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 15px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 5px 20px rgba(80,50,90,0.08);
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 16px 40px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.category {
    border: none;
    border-radius: 18px;
    padding: 18px 10px;
    background: rgba(255,255,255,0.9);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    color: #3d3042;
    box-shadow: 0 5px 18px rgba(70,40,80,0.08);
    transition: 0.2s;
}

.category:hover {
    transform: translateY(-2px);
}

.category.active {
    background: #7b4bd8;
    color: white;
}

.add-business-button {
    display: block;
    width: 100%;
    max-width: 600px;
    margin: 10px auto 22px;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    background: #222;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.results-title {
    text-align: center;
    font-size: 23px;
    font-weight: 800;
    margin: 20px 0;
}

.businesses-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.business-card {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(70,40,80,0.1);
}

.business-card-image {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.business-card-content {
    padding: 17px;
}

.business-card h3 {
    margin: 0 0 8px;
    font-size: 20px;
}

.business-description {
    color: #67596a;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.business-address,
.business-phone,
.business-price {
    font-size: 14px;
    margin: 7px 0;
}

.details-button {
    width: 100%;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    padding: 12px;
    background: #7b4bd8;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.empty-state,
.loading {
    text-align: center;
    background: rgba(255,255,255,0.75);
    border-radius: 18px;
    padding: 25px 18px;
    color: #705d76;
}

.detail-view {
    max-width: 700px;
    margin: 0 auto;
}

.detail-card {
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(70,40,80,0.12);
}

.detail-image {
    width: 100%;
    max-height: 450px;
    object-fit: cover;
    display: block;
}

.detail-content {
    padding: 22px;
}

.detail-content h1 {
    margin: 0 0 15px;
    font-size: 28px;
}

.detail-description {
    font-size: 16px;
    line-height: 1.65;
    color: #574c59;
    white-space: pre-line;
}

.detail-info {
    margin-top: 20px;
}

.detail-info div {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 15px;
}

.back-button {
    display: none;
    border: none;
    background: rgba(255,255,255,0.9);
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    margin-bottom: 15px;
}

.form-wrapper {
    max-width: 600px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(70,40,80,0.1);
}

.form-wrapper h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 700;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 13px;
    font-size: 15px;
    outline: none;
    background: white;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.form-submit {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 14px;
    background: #7b4bd8;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.form-submit:disabled {
    opacity: 0.6;
    cursor: wait;
}

.image-preview {
    margin-top: 10px;
}

.image-preview img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
}

.file-note {
    margin-top: 7px;
    color: #73577e;
    font-size: 12px;
}

.hidden {
    display: none !important;
}

@media (max-width: 700px) {
    .categories {
        grid-template-columns: repeat(2, 1fr);
    }

    .businesses-list {
        grid-template-columns: 1fr;
    }

    .business-card-image {
        height: 210px;
    }

    .detail-content h1 {
        font-size: 24px;
    }
}

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

        </div>
    `;

    const result =
        await supabaseClient
            .from("businesses")
            .select("*")
            .eq("status", "active");

    if (result.error) {

        console.error(result.error);

        businessesList.innerHTML = `
            <div class="empty-state">
                ${escapeHTML(result.error.message)}
            </div>
        `;

        return;
    }

    allBusinesses =
        result.data || [];

    /*
        При первой загрузке
        карточки НЕ показываем.
    */
    selectedCategory = "";

    renderBusinesses();
}


/* =========================
   РЕНДЕР КАРТОЧЕК
========================= */

function renderBusinesses() {

    currentBusiness = null;

    const t =
        translations[currentLanguage];

    const searchText =
        search.value
            .trim()
            .toLowerCase();


    /*
        ГЛАВНАЯ СТРАНИЦА

        Если категория не выбрана
        и поиск пустой — объявления
        вообще не показываем.
    */

    if (!selectedCategory && !searchText) {

        resultsTitle.classList.add("hidden");

        businessesList.innerHTML = "";

        homeMessage.classList.remove("hidden");

        return;
    }


    homeMessage.classList.add("hidden");

    let filtered =
        [...allBusinesses];


    if (selectedCategory) {

        filtered =
            filtered.filter(business =>
                business.category === selectedCategory
            );
    }


    if (searchText) {

        filtered =
            filtered.filter(business => {

                const text = [

                    business.name,
                    business.description,
                    business.address,
                    business.category

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

                return text.includes(searchText);
            });
    }


    if (selectedCategory) {

        resultsTitle.textContent =
            t.categoryNames[selectedCategory] || "";

        resultsTitle.classList.remove("hidden");

    } else {

        resultsTitle.textContent =
            "Результаты поиска";

        resultsTitle.classList.remove("hidden");
    }


    if (!filtered.length) {

        businessesList.innerHTML = `
            <div class="empty-state">
                ${t.empty}
            </div>
        `;

        return;
    }


    businessesList.innerHTML =
        filtered.map(business => {

            const image =
                business.image_url ||
                business["Image URL"] ||
                "";

            const name =
                business.name ||
                business.Name ||
                t.noName;

            const description =
                business.description ||
                business.Description ||
                "";

            const address =
                business.address ||
                business.Address ||
                "";

            const phone =
                business.phone ||
                business.Phone ||
                "";

            const price =
                business.price ??
                business.Price ??
                "";

            const id =
                getBusinessId(business);


            return `
                <div class="business-card">

                    ${
                        image
                        ?
                        `
                        <img
                            class="business-card-image"
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(name)}"
                        >
                        `
                        :
                        ""
                    }

                    <div class="business-card-content">

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        ${
                            description
                            ?
                            `
                            <div class="business-description">
                                ${escapeHTML(description)}
                            </div>
                            `
                            :
                            ""
                        }

                        ${
                            address
                            ?
                            `
                            <div class="business-address">
                                📍 ${escapeHTML(address)}
                            </div>
                            `
                            :
                            ""
                        }

                        ${
                            price
                            ?
                            `
                            <div class="business-price">
                                💰 ${escapeHTML(price)}
                            </div>
                            `
                            :
                            ""
                        }

                        <button
                            class="details-button"
                            data-business-id="${escapeHTML(id)}"
                        >
                            ${t.details}
                        </button>

                    </div>

                </div>
            `;

        }).join("");


    /*
        Кнопки "Подробнее"
    */

    document
        .querySelectorAll(".details-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        button.dataset.businessId;

                    const business =
                        allBusinesses.find(item =>
                            String(getBusinessId(item))
                            === String(id)
                        );

                    if (!business) {
                        return;
                    }

                    /*
                        Сохраняем позицию,
                        где пользователь был
                        в списке.
                    */
                    savedScrollPosition =
                        window.scrollY;

                    renderBusinessDetails(
                        business,
                        true
                    );

                }
            );

        });
}


/* =========================
   ПОДРОБНОСТИ ОБЪЯВЛЕНИЯ
========================= */

function renderBusinessDetails(
    business,
    scrollToTop = true
) {

    currentBusiness =
        business;

    const t =
        translations[currentLanguage];


    /*
        Категория НЕ сбрасывается.
        selectedCategory остаётся прежней.
    */

    const image =
        business.image_url ||
        business["Image URL"] ||
        "";

    const name =
        business.name ||
        business.Name ||
        t.noName;

    const description =
        business.description ||
        business.Description ||
        "";

    const address =
        business.address ||
        business.Address ||
        "";

    const phone =
        business.phone ||
        business.Phone ||
        "";

    const price =
        business.price ??
        business.Price ??
        "";


    /*
        Скрываем список карточек.
        Показываем подробности.
    */

    homeMessage.classList.add("hidden");

    resultsTitle.classList.add("hidden");

    businessesList.className =
        "detail-view";

    backButton.style.display =
        "inline-block";

    addBusinessButton.style.display =
        "none";


    businessesList.innerHTML = `

        <div class="detail-card">

            ${
                image
                ?
                `
                <img
                    class="detail-image"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(name)}"
                >
                `
                :
                ""
            }

            <div class="detail-content">

                <h1>
                    ${escapeHTML(name)}
                </h1>

                ${
                    description
                    ?
                    `
                    <div class="detail-description">
                        ${escapeHTML(description)}
                    </div>
                    `
                    :
                    ""
                }

                <div class="detail-info">

                    ${
                        address
                        ?
                        `
                        <div>
                            <strong>📍 ${escapeHTML(t.address)}:</strong>
                            ${escapeHTML(address)}
                        </div>
                        `
                        :
                        ""
                    }

                    ${
                        phone
                        ?
                        `
                        <div>
                            <strong>📞 ${escapeHTML(t.phone)}:</strong>
                            ${escapeHTML(phone)}
                        </div>
                        `
                        :
                        ""
                    }

                    ${
                        price
                        ?
                        `
                        <div>
                            <strong>💰 ${escapeHTML(t.price)}:</strong>
                            ${escapeHTML(price)}
                        </div>
                        `
                        :
                        ""
                    }

                </div>

            </div>

        </div>
    `;


    /*
        При входе в подробности
        прокручиваем вверх,
        чтобы пользователь увидел
        начало объявления.
    */

    if (scrollToTop) {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


/* =========================
   НАЗАД ИЗ ПОДРОБНОСТЕЙ
========================= */

backButton.addEventListener(
    "click",
    () => {

        /*
            Убираем режим подробностей.
        */

        currentBusiness = null;

        backButton.style.display =
            "none";

        addBusinessButton.style.display =
            "block";

        businessesList.className =
            "businesses-list";


        /*
            Самое главное:
            selectedCategory НЕ сбрасываем.

            Поэтому если пользователь был
            в "Апартаментах", он возвращается
            именно в "Апартаменты".
        */

        renderBusinesses();


        /*
            Возвращаем пользователя
            примерно туда, где он был
            перед нажатием "Подробнее".
        */

        setTimeout(() => {

            window.scrollTo({
                top: savedScrollPosition,
                behavior: "instant"
            });

        }, 50);

    }
);


/* =========================
   КАТЕГОРИИ
========================= */

document
    .querySelectorAll(".category")
    .forEach(category => {

        category.addEventListener(
            "click",
            () => {

                /*
                    Если были в подробностях,
                    выходим из них.
                */

                currentBusiness = null;

                selectedCategory =
                    category.dataset.category;


                /*
                    Активная категория.
                */

                document
                    .querySelectorAll(".category")
                    .forEach(item => {

                        item.classList.toggle(
                            "active",
                            item === category
                        );

                    });


                backButton.style.display =
                    "none";

                addBusinessButton.style.display =
                    "block";

                addBusinessForm.classList.add(
                    "hidden"
                );


                businessesList.className =
                    "businesses-list";


                renderBusinesses();


                /*
                    После выбора категории
                    начинаем список сверху.
                */

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );

    });


/* =========================
   ПОИСК
========================= */

search.addEventListener(
    "input",
    () => {

        /*
            Если пользователь начинает искать
            с главной — показываем результаты.
        */

        currentBusiness = null;

        backButton.style.display =
            "none";

        businessesList.className =
            "businesses-list";

        renderBusinesses();

    }
);


/* =========================
   ДОБАВИТЬ УСЛУГУ
========================= */

addBusinessButton.addEventListener(
    "click",
    () => {

        currentBusiness = null;

        homeMessage.classList.add(
            "hidden"
        );

        resultsTitle.classList.add(
            "hidden"
        );

        businessesList.innerHTML = "";

        businessesList.className =
            "businesses-list";

        addBusinessForm.classList.remove(
            "hidden"
        );

        addBusinessButton.style.display =
            "none";

        backButton.style.display =
            "inline-block";

        /*
            Если категория уже выбрана,
            автоматически ставим её
            в форме.
        */

        if (selectedCategory) {

            document.getElementById(
                "businessCategory"
            ).value =
                selectedCategory;

        }

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================
   ПРЕВЬЮ ФОТО
========================= */

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];

        if (!file) {

            imagePreview.innerHTML =
                "";

            return;
        }


        if (file.size > 10 * 1024 * 1024) {

            alert(
                "Фото должно быть не больше 10 МБ."
            );

            imageInput.value = "";

            imagePreview.innerHTML =
                "";

            return;
        }


        const imageURL =
            URL.createObjectURL(file);


        imagePreview.innerHTML = `
            <img
                src="${imageURL}"
                alt=""
            >
        `;

    }
);


/* =========================
   ОТПРАВКА ФОРМЫ
========================= */

businessForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const t =
            translations[currentLanguage];

        const submitButton =
            document.getElementById(
                "formSubmit"
            );


        const name =
            document.getElementById(
                "businessName"
            ).value.trim();

        const category =
            document.getElementById(
                "businessCategory"
            ).value;

        const description =
            document.getElementById(
                "businessDescription"
            ).value.trim();

        const address =
            document.getElementById(
                "businessAddress"
            ).value.trim();

        const phone =
            document.getElementById(
                "businessPhone"
            ).value.trim();

        const price =
            document.getElementById(
                "businessPrice"
            ).value.trim();

        const imageFile =
            document.getElementById(
                "businessImage"
            ).files[0];


        /*
            Проверка размера фотографии.
        */

        if (
            imageFile &&
            imageFile.size > 10 * 1024 * 1024
        ) {

            alert(
                "Фото должно быть не больше 10 МБ."
            );

            return;
        }


        submitButton.disabled =
            true;

        submitButton.textContent =
            t.uploading;


        let image_url = "";

        let uploadedPath = "";


        try {

            /*
                =========================
                ЗАГРУЗКА ФОТО
                =========================
            */

            if (imageFile) {

                const safeName =
                    imageFile.name
                        .replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        );


                uploadedPath =
                    `${Date.now()}_${Math.random()
                    .toString(36)
                    .slice(2)}_${safeName}`;


                const uploadResult =
                    await supabaseClient
                        .storage
                        .from("business-images")
                        .upload(
                            uploadedPath,
                            imageFile,
                            {
                                cacheControl: "3600",
                                upsert: false
                            }
                        );


                if (uploadResult.error) {

                    console.error(
                        uploadResult.error
                    );

                    throw new Error(
                        "Ошибка загрузки фотографии."
                    );
                }


                const publicResult =
                    supabaseClient
                        .storage
                        .from("business-images")
                        .getPublicUrl(
                            uploadedPath
                        );


                image_url =
                    publicResult.data.publicUrl;
            }


            /*
                =========================
                СОЗДАНИЕ ЗАЯВКИ
                =========================
            */

            const insertResult =
                await supabaseClient
                    .from("businesses")
                    .insert([
                        {
                            name:
                                name,

                            category:
                                category,

                            description:
                                description,

                            address:
                                address,

                            phone:
                                phone,

                            price:
                                price,

                            image_url:
                                image_url,

                            status:
                                "pending"
                        }
                    ]);


            if (insertResult.error) {

                /*
                    Если объявление не создалось,
                    удаляем уже загруженную
                    фотографию.
                */

                if (uploadedPath) {

                    await supabaseClient
                        .storage
                        .from("business-images")
                        .remove([
                            uploadedPath
                        ]);
                }


                console.error(
                    insertResult.error
                );

                throw new Error(
                    insertResult.error.message
                );
            }


            /*
                =========================
                УСПЕШНО
                =========================
            */

            alert(
                t.success
            );


            businessForm.reset();

            imagePreview.innerHTML =
                "";


            addBusinessForm.classList.add(
                "hidden"
            );

            backButton.style.display =
                "none";

            addBusinessButton.style.display =
                "block";


            /*
                Возвращаем пользователя
                туда, где он был.
            */

            renderBusinesses();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Произошла ошибка."
            );

        } finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                t.submit;

        }

    }
);


/* =========================
   ЛОГОТИП
========================= */

document
    .getElementById("logo")
    .addEventListener(
        "click",
        () => {

            /*
                Возвращаемся именно
                на главную.
            */

            currentBusiness = null;

            selectedCategory = "";

            search.value = "";

            document
                .querySelectorAll(".category")
                .forEach(category => {

                    category.classList.remove(
                        "active"
                    );

                });


            addBusinessForm.classList.add(
                "hidden"
            );

            addBusinessButton.style.display =
                "block";

            backButton.style.display =
                "none";

            businessesList.className =
                "businesses-list";

            renderBusinesses();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );


/* =========================
   ЯЗЫКИ
========================= */

document
    .querySelectorAll(".language-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                changeLanguage(
                    button.dataset.language
                );

            }
        );

    });


/* =========================
   СТАРТ
========================= */

changeLanguage("ru");

loadBusinesses();

</script>
