<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batumi Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 0% 0%, #feda75 0%, transparent 28%),
                radial-gradient(circle at 100% 0%, #fa7e1e 0%, transparent 32%),
                radial-gradient(circle at 0% 100%, #d62976 0%, transparent 38%),
                radial-gradient(circle at 100% 100%, #962fbf 0%, transparent 40%),
                linear-gradient(
                    135deg,
                    #feda75 0%,
                    #fa7e1e 25%,
                    #d62976 50%,
                    #962fbf 75%,
                    #4f5bd5 100%
                );
            color: #2d1838;
        }

        header {
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5 0%,
                    #962fbf 30%,
                    #d62976 60%,
                    #fa7e1e 85%,
                    #feda75 100%
                );
            color: white;
            padding: 28px 20px 24px;
            box-shadow: 0 8px 30px rgba(80, 30, 100, 0.25);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 15px;
            opacity: 0.92;
        }

        .languages {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }

        .language-button {
            width: 42px;
            height: 30px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 8px;
            background: rgba(255,255,255,0.16);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .language-button svg {
            width: 32px;
            height: 21px;
            display: block;
            border-radius: 2px;
        }

        .search-container {
            max-width: 1100px;
            margin: 20px auto 0;
        }

        .search-input {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.94);
            color: #35143f;
            font-size: 15px;
            outline: none;
            box-shadow: 0 8px 25px rgba(80, 20, 100, 0.18);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 20px 50px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 12px;
        }

        .category {
            border: 1px solid rgba(255,255,255,0.55);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.88),
                    rgba(255,240,249,0.88)
                );
            color: #522060;
            padding: 15px 12px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 7px 20px rgba(100, 30, 120, 0.13);
            transition: 0.2s ease;
        }

        .category:hover {
            transform: translateY(-2px);
        }

        .category.active {
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
        }

        .results-section {
            margin-top: 30px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .action-button {
            border: none;
            padding: 13px 18px;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            box-shadow: 0 7px 20px rgba(100, 30, 120, 0.25);
        }

        .back-button {
            border: none;
            padding: 13px 18px;
            border-radius: 14px;
            color: #522060;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            background: rgba(255,255,255,0.9);
        }

        .results-title {
            color: white;
            font-size: 23px;
            font-weight: 750;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(70, 20, 90, 0.25);
        }

        .businesses-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .business-card {
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.96),
                    rgba(255,240,249,0.96)
                );
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(90, 20, 110, 0.20);
        }

        .business-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .business-image-placeholder {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976,
                    #fa7e1e
                );
        }

        .business-content {
            padding: 18px;
        }

        .business-name {
            color: #4f1d67;
            font-size: 20px;
            font-weight: 750;
            margin-bottom: 8px;
        }

        .business-description {
            color: #654c70;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .business-info {
            color: #73577e;
            font-size: 14px;
            margin-top: 7px;
        }

        .details-button {
            margin-top: 16px;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 12px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            border: none;
        }

        .empty-state {
            padding: 35px 20px;
            text-align: center;
            background: rgba(255,255,255,0.88);
            border-radius: 18px;
            color: #704f7b;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: white;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(80,20,100,0.25);
        }

        .form-title {
            color: #4f1d67;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #522060;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd0e3;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-input {
            padding: 10px !important;
            cursor: pointer;
        }

        .photo-preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 10px;
            display: none;
        }

        .photo-name {
            margin-top: 8px;
            color: #73577e;
            font-size: 13px;
        }

        .form-submit {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .form-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-message {
            text-align: center;
            padding: 30px 15px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            color: #522060;
        }

        .detail-page {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.96);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(80,20,100,0.25);
        }

        .detail-page img {
            width: 100%;
            max-height: 430px;
            object-fit: cover;
        }

        .detail-content {
            padding: 25px;
        }

        .detail-title {
            color: #4f1d67;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .detail-description {
            color: #654c70;
            line-height: 1.7;
            margin: 18px 0;
            white-space: pre-line;
        }

        .detail-info {
            color: #73577e;
            font-size: 15px;
            margin-top: 10px;
        }

            header {
                padding: 23px 15px 20px;
            }

                font-size: 28px;
            }

                padding: 22px 15px 40px;
            }

            .categories {
                grid-template-columns: repeat(2, 1fr);
            }

            .businesses-list {
                grid-template-columns: 1fr;
            }
        }

/* =========================
   ГЛАВНАЯ
========================= */

function showHome() {

    selectedCategory = "";

    detailsOpen = false;

    categories.forEach(
        category =>
            category.classList.remove("active")
    );

    backButton.style.display =
        "none";

    addBusinessButton.style.display =
        "inline-block";

    resultsTitle.textContent =
        translations[currentLanguage].chooseCategory;

    businessesList.className =
        "businesses-list";

    businessesList.innerHTML = "";
}


/* =========================
   СМЕНА ЯЗЫКА
========================= */

function changeLanguage(language) {

    currentLanguage = language;

    const t =
        translations[language];

    subtitle.textContent =
        t.subtitle;

    searchInput.placeholder =
        t.searchPlaceholder;

    addBusinessButton.textContent =
        t.add;

    backButton.textContent =
        t.back;

    document.documentElement.lang =
        language;

    categories.forEach(category => {

        const key =
            category.dataset.category;

        const text =
            category.querySelector("[data-i18n]");

        if (text) {

            text.textContent =
                t.categoryNames[key];

        }

    });

    /*
        Если пользователь сейчас смотрит
        подробности — НЕ выбрасываем его
        обратно на главную.
    */
    if (detailsOpen) {

        /*
            Находим текущую карточку по
            сохранённому имени/ID через
            открытый detail-page.
        */

        const currentTitle =
            resultsTitle.textContent;

        const business =
            allBusinesses.find(item =>
                String(item.name || item.Name || "") ===
                String(currentTitle)
            );

        if (business) {

            openBusinessDetails(
                business.id ?? business.ID,
                false
            );

        }

        return;
    }

    if (selectedCategory) {

        resultsTitle.textContent =
            t.categoryNames[selectedCategory];

        renderBusinesses();

    } else {

        showHome();

    }
}


/* =========================
   ЗАГРУЗКА
========================= */

async function loadBusinesses() {

    const result =
        await supabaseClient
            .from("businesses")
            .select("*")
            .eq("status", "active");

    if (result.error) {

        console.error(result.error);

        return;
    }

    allBusinesses =
        result.data || [];

    showHome();
}


/* =========================
   ПОКАЗ СПИСКА
========================= */

function renderBusinesses() {

    const t =
        translations[currentLanguage];

    detailsOpen = false;

    if (!selectedCategory) {

        showHome();

        return;
    }

    const searchText =
        searchInput.value
            .trim()
            .toLowerCase();

    const filtered =
        allBusinesses.filter(business => {

            const category =
                String(
                    business.category ||
                    business.Category ||
                    ""
                )
                .trim()
                .toLowerCase();

            const matchesCategory =
                category === selectedCategory;

            const text =
                (
                    String(
                        business.name ||
                        business.Name ||
                        ""
                    ) +
                    " " +
                    String(
                        business.description ||
                        business.Description ||
                        ""
                    ) +
                    " " +
                    String(
                        business.address ||
                        business.Address ||
                        ""
                    )
                )
                .toLowerCase();

            const matchesSearch =
                !searchText ||
                text.includes(searchText);

            return (
                matchesCategory &&
                matchesSearch
            );

        });

    businessesList.innerHTML = "";

    if (filtered.length === 0) {

        businessesList.innerHTML = `
            <div class="empty-state">
                ${t.empty}
            </div>
        `;

        return;
    }

    filtered.forEach(business => {

        const card =
            document.createElement("div");

        card.className =
            "business-card";


        const businessName =
            business.name ||
            business.Name ||
            t.noName;

        const businessDescription =
            business.description ||
            business.Description ||
            "";

        const businessAddress =
            business.address ||
            business.Address ||
            "";

        const businessPhone =
            business.phone ||
            business.Phone ||
            "";

        const businessPrice =
            business.price ??
            business.Price ??
            "";

        const businessImage =
            business.image_url ||
            business["Image URL"] ||
            "";


        let imageHTML;

        if (businessImage) {

            imageHTML = `
                <img
                    class="business-image"
                    src="${businessImage}"
                    alt="${businessName}"
                >
            `;

        } else {

            imageHTML = `
                <div class="business-image-placeholder">
                    🏢
                </div>
            `;

        }


        /*
            ВАЖНО:
            Здесь используется id ИЛИ ID.
        */

        const businessId =
            business.id ??
            business.ID;


        card.innerHTML = `

            ${imageHTML}

            <div class="business-content">

                <div class="business-name">
                    ${businessName}
                </div>

                ${
                    businessDescription
                    ? `
                        <div class="business-description">
                            ${businessDescription}
                        </div>
                    `
                    : ""
                }

                ${
                    businessAddress
                    ? `
                        <div class="business-info">
                            📍 ${businessAddress}
                        </div>
                    `
                    : ""
                }

                ${
                    businessPhone
                    ? `
                        <div class="business-info">
                            📞 ${businessPhone}
                        </div>
                    `
                    : ""
                }

                ${
                    businessPrice
                    ? `
                        <div class="business-info">
                            💰 ${businessPrice}
                        </div>
                    `
                    : ""
                }

                <button
                    type="button"
                    class="details-button"
                >
                    ${t.details}
                </button>

            </div>
        `;


        const detailsButton =
            card.querySelector(".details-button");


        /*
            Кнопка теперь напрямую получает
            правильный ID.
        */

        detailsButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                openBusinessDetails(
                    businessId
                );

            }
        );


        businessesList.appendChild(card);

    });
}


/* =========================
   ПОДРОБНОСТИ
========================= */

function openBusinessDetails(
    id,
    scrollToTop = true
) {

    /*
        Сначала пробуем id,
        потом ID.

        Это исправляет главную проблему
        с кнопкой "Подробнее".
    */

    const business =
        allBusinesses.find(
            item =>
                String(
                    item.id ??
                    item.ID
                ) === String(id)
        );


    if (!business) {

        console.error(
            "Объявление не найдено. ID:",
            id
        );

        return;
    }


    /*
        Запоминаем позицию списка.
    */

    savedScrollPosition =
        window.scrollY;


    detailsOpen = true;


    const t =
        translations[currentLanguage];


    backButton.style.display =
        "inline-block";

    addBusinessButton.style.display =
        "none";


    const businessName =
        business.name ||
        business.Name ||
        t.noName;

    const businessDescription =
        business.description ||
        business.Description ||
        "";

    const businessAddress =
        business.address ||
        business.Address ||
        "";

    const businessPhone =
        business.phone ||
        business.Phone ||
        "";

    const businessPrice =
        business.price ??
        business.Price ??
        "";

    const businessImage =
        business.image_url ||
        business["Image URL"] ||
        "";


    resultsTitle.textContent =
        businessName;


    let imageHTML = "";


    if (businessImage) {

        imageHTML = `
            <img
                src="${businessImage}"
                alt="${businessName}"
            >
        `;

    }


    businessesList.className = "";


    businessesList.innerHTML = `

        <div class="detail-page">

            ${imageHTML}

            <div class="detail-content">

                <div class="detail-title">
                    ${businessName}
                </div>

                ${
                    businessDescription
                    ? `
                        <div class="detail-description">
                            ${businessDescription}
                        </div>
                    `
                    : ""
                }

                ${
                    businessAddress
                    ? `
                        <div class="detail-info">
                            📍 ${businessAddress}
                        </div>
                    `
                    : ""
                }

                ${
                    businessPhone
                    ? `
                        <div class="detail-info">
                            📞 ${businessPhone}
                        </div>
                    `
                    : ""
                }

                ${
                    businessPrice
                    ? `
                        <div class="detail-info">
                            💰 ${businessPrice}
                        </div>
                    `
                    : ""
                }

            </div>

        </div>

    `;


    /*
        При открытии подробностей
        поднимаемся в начало.
    */

    if (scrollToTop) {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}

========================= */

    resultsTitle.textContent =

    businessesList.className = "";

        <div class="form-container">

            <form id="businessForm">

                <div class="form-group">

                    <label>

                </div>

                    </label>

                    <select

                    >

                        <option value="">

                        </option>

                            ${t.categoryNames.car_rental}
                        </option>

                        <option value="excursions">
                            ${t.categoryNames.excursions}
                        </option>

                        <option value="restaurants">
                            ${t.categoryNames.restaurants}
                        </option>

                        <option value="salons">
                            ${t.categoryNames.salons}
                        </option>

                        <option value="psychology">
                            ${t.categoryNames.psychology}
                        </option>

                        <option value="dentistry">
                            ${t.categoryNames.dentistry}
                        </option>

                        <option value="cosmetology">
                            ${t.categoryNames.cosmetology}
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        ${t.description}
                    </label>

                    <textarea
                        id="businessDescription"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label>
                        ${t.address}
                    </label>

                    <input
                        type="text"

                    >

                </div>

                <div class="form-group">

                    <label>
                        ${t.phone}
                    </label>

                    <input
                        type="text"
                        id="businessPhone"
                    >

                </div>

                <div class="form-group">

                    <label>
                        ${t.price}
                    </label>

                    <input
                        type="text"
                        id="businessPrice"
                        placeholder="100 GEL"
                    >

                </div>

                <div class="form-group">

                    <label>
                        ${t.image}
                    </label>

                    <input
                        type="file"
                        id="businessImage"
                        class="file-input"
                        accept="image/*"
                    >

                    <div
                        class="photo-name"
                        id="photoName"
                    >
                        ${t.photoHint}
                    </div>

                    <img
                        id="photoPreview"
                        class="photo-preview"
                        alt="Preview"
                    >

                </div>

                <button
                    type="submit"
                    class="form-submit"
                    id="submitButton"
                >
                    ${t.submit}
                </button>

            </form>

        </div>
    `;


    /*
        Предварительный просмотр фотографии.
    */

    const imageInput =
        document.getElementById("businessImage");

    const photoPreview =
        document.getElementById("photoPreview");

    const photoName =
        document.getElementById("photoName");


    imageInput.addEventListener(
        "change",
        function() {

            const file =
                imageInput.files[0];


            if (!file) {

                photoPreview.style.display =
                    "none";

                photoName.textContent =
                    t.photoHint;

                return;
            }


            photoName.textContent =
                file.name;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    photoPreview.src =
                        event.target.result;

                    photoPreview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );

        .getElementById("businessForm")
        .addEventListener(

        );
}


/* =========================
   ЗАГРУЗКА ФОТО
========================= */

async function uploadBusinessImage(file) {

    if (!file) {
        return "";
    }


    const fileExtension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const safeExtension =
        fileExtension || "jpg";


    const fileName =
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10) +
        "." +
        safeExtension;


    const filePath =
        "businesses/" +
        fileName;


    const uploadResult =
        await supabaseClient
            .storage
            .from("business-images")
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (uploadResult.error) {

        console.error(
            "Storage upload error:",
            uploadResult.error
        );

        throw uploadResult.error;
    }


    const publicResult =
        supabaseClient
            .storage
            .from("business-images")
            .getPublicUrl(filePath);


    return publicResult.data.publicUrl;
}


/* =========================
   ОТПРАВКА ФОРМЫ
========================= */

async function submitBusinessForm(event) {

    event.preventDefault();


    const submitButton =
        document.getElementById("submitButton");


    submitButton.disabled = true;

    submitButton.textContent =
        translations[currentLanguage].upload;


    try {

        const name =
            document
                .getElementById("businessName")
                .value
                .trim();


        const category =
            document
                .getElementById("businessCategory")
                .value;


        const description =
            document
                .getElementById("businessDescription")
                .value
                .trim();


        const address =
            document
                .getElementById("businessAddress")
                .value
                .trim();


        const phone =
            document
                .getElementById("businessPhone")
                .value
                .trim();


        const price =
            document
                .getElementById("businessPrice")
                .value
                .trim();


        const imageInput =
            document
                .getElementById("businessImage");


        const file =
            imageInput.files[0];


        let image_url = "";


        if (file) {

            image_url =
                await uploadBusinessImage(file);

        }


        submitButton.textContent =
            translations[currentLanguage].submit;


        const result =
            await supabaseClient
                .from("businesses")
                .insert([

                    {
                        name: name,
                        category: category,
                        description: description,
                        address: address,
                        phone: phone,
                        price: price,
                        image_url: image_url,
                        status: "pending"
                    }

                ]);


        if (result.error) {

            console.error(
                "Database error:",
                result.error
            );

            throw result.error;
        }


        detailsOpen = false;


        businessesList.className = "";


        businessesList.innerHTML = `

            <div class="success-message">

                <h2>
                    ✓
                </h2>

                <br>

                ${translations[currentLanguage].success}

            </div>

        `;

    }

    catch (error) {

        console.error(error);

        alert(
            "Ошибка при отправке заявки. Проверьте Storage и права доступа."
        );

        submitButton.disabled = false;

        submitButton.textContent =
            translations[currentLanguage].submit;
    }
}
