<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batumi Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 0% 0%,
                    #feda75 0%,
                    transparent 28%
                ),
                radial-gradient(
                    circle at 100% 0%,
                    #fa7e1e 0%,
                    transparent 32%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    #d62976 0%,
                    transparent 38%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    #962fbf 0%,
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #feda75 0%,
                    #fa7e1e 25%,
                    #d62976 50%,
                    #962fbf 75%,
                    #4f5bd5 100%
                );
            color: #2d1838;
        }
        header {
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5 0%,
                    #962fbf 30%,
                    #d62976 60%,
                    #fa7e1e 85%,
                    #feda75 100%
                );
            color: white;
            padding: 28px 20px 24px;
            box-shadow: 0 8px 30px rgba(80, 30, 100, 0.25);
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .subtitle {
            margin-top: 6px;
            font-size: 15px;
            opacity: 0.92;
        }
        /* ТОЛЬКО ФЛАГИ */
        .languages {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }
        .language-button {
            width: 42px;
            height: 30px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 8px;
            background: rgba(255,255,255,0.16);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .language-button svg {
            width: 32px;
            height: 21px;
            display: block;
            border-radius: 2px;
        }
        .language-button:hover {
            background: rgba(255,255,255,0.28);
        }
        .search-container {
            max-width: 1100px;
            margin: 20px auto 0;
        }
        .search-input {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.94);
            color: #35143f;
            font-size: 15px;
            outline: none;
            box-shadow:
                0 8px 25px rgba(80, 20, 100, 0.18);
        }
        .search-input::placeholder {
            color: #927f9b;
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 20px 50px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(145px, 1fr)
            );
            gap: 12px;
        }
        .category {
            border: 1px solid rgba(255,255,255,0.55);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.88),
                    rgba(255,240,249,0.88)
                );
            color: #522060;
            padding: 15px 12px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow:
                0 7px 20px rgba(100, 30, 120, 0.13);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }
        .category:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 25px rgba(120, 30, 130, 0.22);
        }
        .category.active {
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
            box-shadow:
                0 8px 25px rgba(150, 47, 191, 0.35);
        }
        .results-section {
            margin-top: 30px;
        }
        .results-title {
            color: white;
            font-size: 23px;
            font-weight: 750;
            margin-bottom: 16px;
            text-shadow:
                0 2px 10px rgba(70, 20, 90, 0.25);
        }
        .businesses-list {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );
            gap: 18px;
        }
        .business-card {
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.96),
                    rgba(255,240,249,0.96)
                );
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 20px;
            box-shadow:
                0 12px 35px rgba(90, 20, 110, 0.20);
        }
        .business-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }
        .business-image-placeholder {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976,
                    #fa7e1e
                );
        }
        .business-content {
            padding: 18px;
        }
        .business-name {
            color: #4f1d67;
            font-size: 20px;
            font-weight: 750;
            margin-bottom: 8px;
        }
        .business-description {
            color: #654c70;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .business-info {
            color: #73577e;
            font-size: 14px;
            margin-top: 7px;
        }
        .details-button {
            margin-top: 16px;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 12px;
            background:
                linear-gradient(
                    135deg,
                    #4f5bd5,
                    #962fbf,
                    #d62976
                );
            color: white;
            font-size: 14px;
            font-weight: 650;
            box-shadow:
                0 5px 15px rgba(150, 47, 191, 0.25);
        }
        .details-button:hover {
            background:
                linear-gradient(
                    135deg,
                    #962fbf,
                    #d62976,
                    #fa7e1e
                );
        }
        .empty-state {
            padding: 35px 20px;
            text-align: center;
            background: rgba(255,255,255,0.88);
            border-radius: 18px;
            color: #704f7b;
            box-shadow:
                0 10px 25px rgba(100, 30, 120, 0.15);
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: white;
            font-size: 15px;
        }
        @media (max-width: 600px) {
            header {
                padding: 23px 15px 20px;
            }
            .logo {
                font-size: 28px;
            }
            main {
                padding: 22px 15px 40px;
            }
            .categories {
                grid-template-columns:
                    repeat(2, 1fr);
            }
            .businesses-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <div class="logo">
            Batumi Hub
        </div>
        <div class="subtitle">
            Все услуги Батуми в одном месте
        </div>
        <div class="languages">
            <!-- ФЛАГ ГРУЗИИ -->
            <button
                class="language-button"
                title="ქართული"
                aria-label="ქართული"
            >
                <svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">
                    <rect width="280" height="180" fill="#ffffff"/>
                    <rect x="132" y="0" width="16" height="180" fill="#d40000"/>
                    <rect x="0" y="82" width="280" height="16" fill="#d40000"/>
                    <g fill="#d40000">
                        <rect x="45" y="24" width="10" height="52"/>
                        <rect x="24" y="45" width="52" height="10"/>
                        <rect x="225" y="24" width="10" height="52"/>
                        <rect x="204" y="45" width="52" height="10"/>
                        <rect x="45" y="104" width="10" height="52"/>
                        <rect x="24" y="125" width="52" height="10"/>
                        <rect x="225" y="104" width="10" height="52"/>
                        <rect x="204" y="125" width="52" height="10"/>
                    </g>
                </svg>
            </button>
            <!-- ФЛАГ РОССИИ -->
            <button
                class="language-button"
                title="Русский"
                aria-label="Русский"
            >
                <svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">
                    <rect width="280" height="60" fill="#ffffff"/>
                    <rect y="60" width="280" height="60" fill="#0052b4"/>
                    <rect y="120" width="280" height="60" fill="#d80027"/>
                </svg>
            </button>
            <!-- ФЛАГ ВЕЛИКОБРИТАНИИ -->
            <button
                class="language-button"
                title="English"
                aria-label="English"
            >
                <svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">
                    <rect width="280" height="180" fill="#012169"/>
                    <path
                        d="M0 0 L32 0 L280 148 L280 180 L248 180 L0 32 Z"
                        fill="#ffffff"
                    />
                    <path
                        d="M280 0 L248 0 L0 148 L0 180 L32 180 L280 32 Z"
                        fill="#ffffff"
                    />
                    <path
                        d="M0 0 L12 0 L280 160 L280 180 L268 180 L0 20 Z"
                        fill="#c8102e"
                    />
                    <path
                        d="M280 0 L268 0 L0 160 L0 180 L12 180 L280 20 Z"
                        fill="#c8102e"
                    />
                    <rect
                        x="115"
                        width="50"
                        height="180"
                        fill="#ffffff"
                    />
                    <rect
                        y="65"
                        width="280"
                        height="50"
                        fill="#ffffff"
                    />
                    <rect
                        x="125"
                        width="30"
                        height="180"
                        fill="#c8102e"
                    />
                    <rect
                        y="75"
                        width="280"
                        height="30"
                        fill="#c8102e"
                    />
                </svg>
            </button>
        </div>
        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Поиск бизнеса или услуги..."
            >
        </div>
    </div>
</header>
<main>
    <div class="categories">
        <div class="category" data-category="apartments">
            🏠 Апартаменты
        </div>
        <div class="category" data-category="car_rental">
            🚗 Аренда авто
        </div>
        <div class="category" data-category="transfers">
            🚕 Трансферы
        </div>
        <div class="category" data-category="excursions">
            🗺️ Экскурсии
        </div>
        <div class="category" data-category="restaurants">
            🍽️ Рестораны
        </div>
        <div class="category" data-category="salons">
            💇 Салоны
        </div>
        <div class="category" data-category="barbershops">
            💈 Барбершопы
        </div>
        <div class="category" data-category="psychology">
            🧠 Психология
        </div>
        <div class="category" data-category="dentistry">
            🦷 Стоматология
        </div>
        <div class="category" data-category="cosmetology">
            💄 Косметология
        </div>
        <div class="category" data-category="fitness">
            🏋️ Фитнес
        </div>
        <div class="category" data-category="language_schools">
            📚 Языковые школы
        </div>
    </div>
    <div class="results-section">
        <div class="results-title">
            Бизнесы
        </div>
        <div
            id="businessesList"
            class="businesses-list"
        ></div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL =
        "https://mzbweaovalklyojtdrmq.supabase.co";
    const SUPABASE_KEY =
        "sb_publishable_uaJkPRsPjlYnv-JPUU0UfA_EV9JEzmx";
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    const businessesList =
        document.getElementById(
            "businessesList"
        );
    const searchInput =
        document.getElementById(
            "searchInput"
        );
    const categories =
        document.querySelectorAll(
            ".category"
        );
    let allBusinesses = [];
    let selectedCategory = "";
    async function loadBusinesses() {
        businessesList.innerHTML = `
            <div class="loading">
                Загружаем бизнесы...
            </div>
        `;
        const result =
            await supabaseClient
                .from("businesses")
                .select("*")
                .eq("status", "active");
        if (result.error) {
            businessesList.innerHTML = `
                <div class="empty-state">
                    Ошибка загрузки бизнесов
                </div>
            `;
            console.error(result.error);
            return;
        }
        allBusinesses =
            result.data || [];
        renderBusinesses();
    }
    function renderBusinesses() {
        const searchText =
            searchInput.value
                .trim()
                .toLowerCase();
        let filtered =
            allBusinesses.filter(
                function(business) {
                    const matchesSearch =
                        !searchText ||
                        String(
                            business.name || ""
                        )
                        .toLowerCase()
                        .includes(searchText) ||
                        String(
                            business.description || ""
                        )
                        .toLowerCase()
                        .includes(searchText) ||
                        String(
                            business.address || ""
                        )
                        .toLowerCase()
                        .includes(searchText) ||
                        String(
                            business.category || ""
                        )
                        .toLowerCase()
                        .includes(searchText);
                    const matchesCategory =
                        !selectedCategory ||
                        String(
                            business.category || ""
                        )
                        .trim()
                        .toLowerCase()
                        ===
                        selectedCategory;
                    return (
                        matchesSearch &&
                        matchesCategory
                    );
                }
            );
        businessesList.innerHTML = "";
        if (filtered.length === 0) {
            businessesList.innerHTML = `
                <div class="empty-state">
                    Пока здесь нет добавленных бизнесов.
                </div>
            `;
            return;
        }
        filtered.forEach(
            function(business) {
                const card =
                    document.createElement(
                        "div"
                    );
                card.className =
                    "business-card";
                let imageHTML;
                if (business.image_url) {
                    imageHTML = `
                        <img
                            class="business-image"
                            src="${business.image_url}"
                            alt="${business.name || "Business"}"
                        >
                    `;
                } else {
                    imageHTML = `
                        <div class="business-image-placeholder">
                            🏢
                        </div>
                    `;
                }
                card.innerHTML = `
                    ${imageHTML}
                    <div class="business-content">
                        <div class="business-name">
                            ${business.name || "Без названия"}
                        </div>
                        ${
                            business.description
                            ? `
                                <div class="business-description">
                                    ${business.description}
                                </div>
                            `
                            : ""
                        }
                        ${
                            business.address
                            ? `
                                <div class="business-info">
                                    📍 ${business.address}
                                </div>
                            `
                            : ""
                        }
                        ${
                            business.phone
                            ? `
                                <div class="business-info">
                                    📞 ${business.phone}
                                </div>
                            `
                            : ""
                        }
                        <div class="details-button">
                            Подробнее →
                        </div>
                    </div>
                `;
                businessesList.appendChild(
                    card
                );
            }
        );
    }
    categories.forEach(
        function(category) {
            category.addEventListener(
                "click",
                function() {
                    categories.forEach(
                        function(item) {
                            item.classList.remove(
                                "active"
                            );
                        }
                    );
                    category.classList.add(
                        "active"
                    );
                    selectedCategory =
                        category
                            .dataset
                            .category;
                    renderBusinesses();
                }
            );
        }
    );
    searchInput.addEventListener(
        "input",
        function() {
            renderBusinesses();
        }
    );
    loadBusinesses();
</script>
</body>
</html>
